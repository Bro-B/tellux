<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="sandcastle-order" content="70" />
  <meta name="sandcastle-thumbnail" content="https://picture.cyanfish.site/202607021558314.png" />
  <title>Tellux Vegetation Forest</title>
  <script type="module" crossorigin src="/tellux/assets/vegetation-Cy3D889H.js"></script>
  <link rel="modulepreload" crossorigin href="/tellux/assets/toggle-DIIVrEA5.js">
  <link rel="modulepreload" crossorigin href="/tellux/assets/shared-Cn6kmm9J.js">
  <link rel="modulepreload" crossorigin href="/tellux/assets/ez-tree.es-sa-R6ecl.js">
  <link rel="modulepreload" crossorigin href="/tellux/assets/location-readout-CDm1IW0n.js">
  <link rel="modulepreload" crossorigin href="/tellux/assets/example-panel-HGVPe6NO.js">
  <link rel="modulepreload" crossorigin href="/tellux/assets/boot-DxnVbI2c.js">
  <link rel="stylesheet" crossorigin href="/tellux/assets/toggle-D54SvzIR.css">
</head>

<body>
  <main class="viewer-shell">
    <div id="viewer"></div>
    <aside class="example-panel" id="vegetation-panel" data-i18n-attr="aria-label:example.vegetation.panel.aria" aria-label="程序化植被森林控件">
      <header class="example-panel__chrome">
        <button
          type="button"
          class="example-panel__fold"
          id="vegetation-panel-fold"
          aria-expanded="true"
          aria-controls="vegetation-panel-body"
          title="收起面板"
          aria-label="收起面板"
          data-i18n-attr="title:common.panel.collapse,aria-label:common.panel.collapse"
        ></button>
        <span class="example-panel__title" data-i18n="example.vegetation.panel.title">程序化植被森林</span>
      </header>

      <div class="example-panel__collapse" id="vegetation-panel-body">
        <div class="example-panel__content">
          <details class="example-panel__folder" open>
            <summary class="example-panel__folder-summary" data-i18n="example.vegetation.folder.actions">操作</summary>
            <div class="example-panel__folder-collapse">
              <div class="example-panel__folder-body">
                <button class="example-panel__button" id="fly-to-forest" type="button" data-i18n="example.vegetation.btn.fly">飞到森林</button>
                <button class="example-panel__button example-panel__button--ghost" id="regenerate-vegetation" type="button" data-i18n="example.vegetation.btn.regen">
                  重新生成
                </button>
              </div>
            </div>
          </details>

          <details class="example-panel__folder" open>
            <summary class="example-panel__folder-summary" data-i18n="example.vegetation.folder.status">状态</summary>
            <div class="example-panel__folder-collapse">
              <div class="example-panel__folder-body">
                <p id="vegetation-status" class="example-panel__status" aria-live="polite" data-i18n="example.vegetation.status.initial">正在准备植被场景...</p>
                <dl class="example-panel__readout">
                  <dt>Center</dt>
                  <dd>103.551329, 31.025122</dd>
                  <dt>Instances</dt>
                  <dd id="vegetation-count">-</dd>
                  <dt>Source</dt>
                  <dd>terrain</dd>
                  <dt>Sampling</dt>
                  <dd id="vegetation-sampling-status">-</dd>
                </dl>
              </div>
            </div>
          </details>
        </div>
      </div>
    </aside>
  </main>
</body>

</html>
